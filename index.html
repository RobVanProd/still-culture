<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A living medium grows in a dish, and every instrument that would tell you what it is doing also damages it.">
<title>STILL CULTURE</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    /* dvh rather than vh: on a phone, vh is the height with the browser chrome
       hidden, so a 100vh layout is taller than the visible page and the bottom
       of the interface — which is exactly where the tool palette lives — sits
       under the address bar until the user scrolls, which they cannot do. */
    height: 100dvh; min-height: 100%;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    background: #05070c;
    font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    color: #cfd8e8;
  }
  #stage { position: fixed; inset: 0; display: block; }
  #gl { width: 100%; height: 100%; display: block; touch-action: none; }

  #hud {
    position: fixed; top: 10px; left: 12px;
    font-size: 11px; line-height: 1.45;
    white-space: pre;
    color: #7f92ad;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.85);
    opacity: .85;
  }
  #hud.hidden { display: none; }
  @media (max-width: 720px) {
    /* Clear of the notch, and clear of the palette at the bottom. */
    #hud { top: calc(8px + env(safe-area-inset-top, 0px)); left: 10px; font-size: 10px; }
  }
  #hud b { color: #d6e2f2; font-weight: 600; }
  #hud .bad { color: #ff6b6b; }

  #fatal {
    position: fixed; inset: 0; display: none;
    place-content: center; padding: 8vw;
    background: #05070c; color: #ffb4b4;
    font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow: auto;
  }
  #fatal.show { display: grid; }
</style>
</head>
<body>
  <div id="stage"><canvas id="gl"></canvas></div>
  <div id="hud"></div>
  <pre id="fatal"></pre>

  <script type="module">
    // Surface errors on screen. A browser game that fails silently to a black
    // canvas is the single worst thing for an iteration loop — and for an agent
    // driving this through a screenshot, an invisible error is indistinguishable
    // from a rendering bug.
    const fatal = document.getElementById('fatal');
    function show(err) {
      fatal.classList.add('show');
      fatal.textContent = (fatal.textContent ? fatal.textContent + '\n\n' : '') +
        (err && err.stack ? err.stack : String(err));
      console.error('[fatal]', err);
    }
    addEventListener('error', (e) => show(e.error || e.message));
    addEventListener('unhandledrejection', (e) => show(e.reason));

    import('./src/main.js').catch(show);
  </script>
</body>
</html>
